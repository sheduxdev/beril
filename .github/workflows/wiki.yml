name: wiki

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "docs/**"
      - "references/**"
      - "agents/**"
      - "knowledge/**"
      - "SKILL.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "scripts/build_docs.py"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Export the wiki pages
        run: python3 scripts/build_docs.py --wiki "$RUNNER_TEMP/wiki-new"
      - name: Push to the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"; then
            echo "::warning::The wiki has no first page yet. Create one in the web UI, then rerun this workflow."
            exit 0
          fi
          rsync -a --delete --exclude .git "$RUNNER_TEMP/wiki-new/" "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "docs: sync wiki from ${GITHUB_SHA::7}"
          git push
