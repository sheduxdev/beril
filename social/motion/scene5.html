 const dr=ez(t/1.3);$('frame').setAttribute('stroke-dashoffset',2600*(1-dr));$('topl').setAttribute('stroke-dashoffset',800*(1-ez((t-.5)/.8)));$('tb').setAttribute('opacity',ez((t-.9)/.5));
 for(let k=0;k<4;k++)$('dg'+k).style.opacity=ez((t-.6-k*.12)/.4);
 // attackers (scene 0-1)
 for(let k=0;k<4;k++){const a=$('ak'+k);const t0=.9+k*.35,p=ez((t-t0)/1.1);const x=lerp(-60,DOORS[k].x+50,p),y=lerp(120+k*140,560,p);
  const vis=t<S[2]?cl((t-t0)*4)*(t<S[1]?1:1-ez((t-S[1])/.6)):0;a.setAttribute('transform',`translate(${x},${y})`);a.setAttribute('opacity',vis)}
 // door states
 const kn=k=>1.7+k*.45;
 for(let k=0;k<4;k++){let st=0;
  if(t<S[2]){st=t>kn(k)?1:0;ripple(k,t,kn(k),'#ff6b6b')}
  else if(t<S[4]){const tt=S[3]+D(3)*(.2+k*.15);st=t>tt?(k==1?2:4):0;for(let j=0;j<3;j++)$('rc'+k+j).setAttribute('opacity',0)}
  else if(t<S[5]){const u=t-S[4],d=D(4);if(k==1){const kk=d*.3;st=u<kk?0:u<d*.78?2:3;ripple(1,u,kk,'#ffb7d5');ripple(1,u,kk+.35,'#ffb7d5')}else st=4}
  else st=k==1?3:4;
  if(t>=S[7])st=3;
  setDoor(k,st,t);
  const tg=$('dt'+k);if(t>=S[3]&&t<S[5]){const tt=S[3]+D(3)*(.2+k*.15);const on=t>tt;tg.setAttribute('opacity',on?1:0);let txt=T.doorTag[k];if(k==1&&t>S[4]+D(4)*.78)txt=T.locked;tg.textContent=txt;tg.setAttribute('fill',txt.startsWith('▲')?'#ffd27a':'#7fe3a4')}else tg.setAttribute('opacity',0)}
 // radar
 const ra=t>=S[3]&&t<S[4]?ez((t-S[3])/.5)*(1-ez((t-(S[4]-.3))/.3)):0;$('rad').setAttribute('opacity',ra);$('rw').setAttribute('transform',`rotate(${-(t*140)%360} 484 380)`);
 // scout
 let so=0,sx=484,sy=650;
 if(t>=S[3]&&t<S[5]){so=ez((t-S[3])/.5);if(t>=S[4]){const u=t-S[4],d=D(4);const p=eio((u-.6)/(d*.25));sx=lerp(484,DOORS[1].x+50,p);sy=lerp(650,470,p)}else{sx=484+120*Math.sin(t*1.6);sy=650}}
 $('scout').setAttribute('opacity',so*(t<S[5]-.3?1:0));$('scout').setAttribute('transform',`translate(${sx},${sy})`);
}
// ---------- background
const cv=$('cv'),cx=cv.getContext('2d');
function bg(t){cx.clearRect(0,0,1080,1920);const w=warm(t);cx.font="22px 'JetBrainsMono Nerd Font Mono',monospace";
 for(let c=0;c<27;c++){const x=c*40+8,sp=50+rnd(c)*100,off=rnd(c+50)*2000;for(let r=0;r<20;r++){const y=((t*sp+off-r*30)%2100)-60;const a=(1-r/20)*.09*(1-w*.7)*(.4+.6*rnd(c*9+r));if(a<.01)continue;cx.fillStyle=`rgba(127,227,164,${a})`;cx.fillText(GL[Math.floor(rnd(c*13+r+Math.floor(t*3))*GL.length)],x,y)}}
 for(let i=0;i<14;i++){const x=(rnd(i)*1080+30*Math.sin(t*.6+i))%1080,y=1920-((t*40+rnd(i+30)*1920)%1920);const a=.2+.2*Math.sin(t*2+i);cx.fillStyle=i%2?`rgba(255,183,213,${a})`:`rgba(127,227,164,${a})`;cx.font='26px sans-serif';cx.fillText('✦',x,y)}
 const gx=540+260*Math.sin(t*.3),gy=900+180*Math.cos(t*.25);
 const c1=w>0?`rgba(255,${Math.round(lerp(140,190,w))},${Math.round(lerp(160,150,w))},${.08+.14*w})`:'rgba(143,232,255,.07)';
 $('glow').style.background=`radial-gradient(circle at ${gx}px ${gy}px,rgba(127,227,164,${.1*(1-w)}),transparent 45%),radial-gradient(ellipse at 50% ${lerp(110,0,w)}%,${w>0?`rgba(255,170,150,${.22*w})`:'rgba(0,0,0,0)'},transparent 60%),radial-gradient(circle at 50% 30%,${c1},transparent 60%)`}
function clock(t){const m=t>=S[7]?420:Math.round(lerp(192,402,cl(t/S[7])));const hh=String(Math.floor(m/60)).padStart(2,'0'),mm=String(m%60).padStart(2,'0');const w=warm(t);
 $('clock').innerHTML=`<span style="color:${w>.5?'#ffd27a':'#eaf5ee'}">${w>.5?'☀':'☾'} ${hh}:${mm}</span><small>${w>.5?T.morning:T.night}</small>`;
 glitch($('clock'),t,S[7]-.1,.6)}
// ---------- scenes
const SC=['s0','s1','s2','s3','s4','s5','s6','s7','s8','s9'];
function seek(t){
 $('prog').style.width=(968*cl(t/TOTAL))+'px';bg(t);clock(t);world(t);
 for(let i=0;i<10;i++){const s0=S[i],s1=i<9?S[i+1]:TOTAL+1,e=$(SC[i]);
  const a=i==0?1:ez((t-s0)/.4),o=i<9?ez((t-(s1-.28))/.28):0,op=t<s0-.01?0:a*(1-o);
  e.style.opacity=op;e.style.transform=`translateY(${(1-a)*50-o*40}px)`;e.style.visibility=op<=0?'hidden':'visible';
  if(op>0){scene(i,t-s0,s1-s0);$('bb').textContent=T.bub[i];const m=i==0?0:a*(1-o);$('mas').style.opacity=m;$('mas').style.transform=`translateY(${(1-a)*20}px) scale(${i==1?1+.06*Math.sin((t-s0)*6)*(1-ez((t-s0)/1.5)):1})`}}
}
function scene(i,u,d){
 if(i==0){$('hk').textContent=typed(T.hook,u,1.2,22);glitch($('hk'),u,1.2,.5)}
 if(i==1){$('turn').innerHTML=T.turn;const a=ez(u/.5);$('turn').style.opacity=a;$('turn').style.transform=`scale(${.9+.1*a})`;glitch($('turn'),u,0,.5)}
 if(i==2){$('hscan').style.top=((u*300)%470)+'px';$('himg').style.transform=`scale(${1+.05*cl(u/d)})`;
  $('logo').textContent=decode('BERIL',u,.3,.9,3);glitch($('logo'),u,.3,1);
  const tg=typed(T.tag,u,1.4,30);$('tg').innerHTML=tg+(tg.length<T.tag.length?'<span class=cur></span>':'');
  [0,1,2].forEach(k=>rv($('ch'+k),ez((u-d*.55-k*.25)/.4),24))}
 if(i==3){$('lk3').textContent=typed(T.look,u,.3,24);
  T.checks.forEach((c,k)=>{const t0=d*(.15+k*.13);rv($('ck'+k),ez((u-t0)/.35),20);const on=u>t0+.4;$('cs'+k).textContent=on?c[1]:'…';$('cs'+k).className=on?(c[1]=='▲'?'w':'g'):'dim'})}
 if(i==4){rv($('perm'),ez(u/.4),-20,0,.1);
  const act=u<d*.18?0:u<d*.3?1:u<d*.6?2:3;
  for(let k=0;k<4;k++){const e=$('pp'+k),done=k<act,on=k==act;e.style.borderColor=on?'#ffb7d5':done?'#7fe3a4':'#1c3a2a';e.style.color=on?'#ffb7d5':done?'#7fe3a4':'#7a9886';e.textContent=(done?'✓ ':'')+T.pipe[k];e.style.opacity=ez((u-.3-k*.1)/.3)}
  rv($('evc'),ez((u-d*.42)/.4),0,-80);for(let k=0;k<3;k++)$('el'+k).style.opacity=ez((u-d*.46-k*.25)/.3);
  rv($('fxc'),ez((u-d*.62)/.4),0,80)}
 if(i==5){const n=T.mont.length;let st='';
  for(let k=0;k<n;k++){const t0=d*(.04+k*.165),t1=t0+d*.165;const e=$('mc'+k);const a=ez((u-t0)/.3),o=k<n-1?ez((u-(t1-.2))/.25):ez((u-(d*.86))/.3);
   e.style.opacity=a*(1-o);e.style.transform=`translateY(${(1-a)*60}px) scale(${1-o*.4})`;e.style.visibility=a*(1-o)>0?'visible':'hidden';
   if(u>t1-.05)st+=`<span class='chip mono g' style="font-size:24px;padding:8px 14px">✓ ${T.mont[k][1]}</span>`}
  $('stack').innerHTML=st;rv($('norun'),ez((u-d*.86)/.4),30)}
 if(i==6){$('yes').innerHTML=T.yes;rv($('yes'),ez(u/.5),30);
  const on=u>d*.22;const sw=$('bigsw');sw.style.background=on?'#7fe3a4':'#16241c';sw.firstChild.style.left=(on?78:8)+'px';sw.firstChild.style.background=on?'#04120a':'#52665a';
  $('swl').innerHTML=on?`<span class=g>${LANG=='tr'?'izin: AÇIK':'permission: ON'}</span>`:`<span class=dim>${LANG=='tr'?'izin: …':'permission: …'}</span>`;
  for(let k=0;k<3;k++)rv($('tr'+k),ez((u-d*(.35+k*.17))/.4),0,70)}
 if(i==7){rv($('repc'),ez((u-.5)/.5),50);for(let k=0;k<3;k++)rv($('rl'+k),ez((u-1.1-k*.5)/.4),0,60)}
 if(i==8){[10,25,191].forEach((v,k)=>{rv($('gc'+k),ez((u-.2-k*.35)/.4),30);$('gn'+k).textContent=Math.round(v*ez((u-.3-k*.35)/1))});
  for(let k=0;k<10;k++)rv($('lb'+k),ez((u-d*.5-k*.12)/.3),16)}
 if(i==9){$('pw').innerHTML=T.power;rv($('pw'),ez(u/.6),0,0,.08);glitch($('pw'),u,0,.6);$('pw2').textContent=typed(T.pw2,u,.8,30);
  let t0=1.5,out='';for(let k=0;k<3;k++){const ty=typed(CMDS[k],u,t0,30);if(u>=t0)out+='<span class=g>$</span> '+ESC(ty)+(ty.length<CMDS[k].length?'<span class=cur></span>':'')+'\n';t0+=CMDS[k].length/30+.35}
  if(u>t0)out+='<span class=pk>♡</span> <span class=g>ready</span>';$('t9').innerHTML=out;
  const a=ez((u-d*.5)/.5);const gh=$('gh');gh.style.opacity=a;gh.style.transform=`scale(${.9+.1*a})`;gh.style.boxShadow=`0 0 ${30+25*Math.sin(u*4)}px rgba(127,227,164,.35)`}
}
function events(){const ev=[];const add=(t,k)=>ev.push([t,k,1]);
 for(let k=0;k<4;k++){add(1.7+k*.45,'knock');add(1.7+k*.45+.14,'knock')}
 for(let i=0;i<T.hook.length;i++)add(1.2+i/22,'key');
 for(let i=1;i<10;i++)add(S[i]-.05,'whoosh');
 for(let i=0;i<T.tag.length;i++)add(S[2]+1.4+i/30,'key');
 for(let k=0;k<4;k++)add(S[3]+D(3)*(.2+k*.15),'tick');for(let k=0;k<5;k++)add(S[3]+D(3)*(.15+k*.13)+.4,'tick');
 const d4=D(4);add(S[4]+.05,'switch');add(S[4]+d4*.3,'knock');add(S[4]+d4*.3+.14,'knock');add(S[4]+d4*.3+.35,'knock');add(S[4]+d4*.42,'pop');add(S[4]+d4*.62,'pop');add(S[4]+d4*.78,'switch');
 const d5=D(5);for(let k=0;k<5;k++)add(S[5]+d5*(.04+k*.165),'pop');
 const d6=D(6);add(S[6]+d6*.22,'switch');for(let k=0;k<3;k++)add(S[6]+d6*(.35+k*.17),'tick');
 for(let k=0;k<3;k++)add(S[7]+1.1+k*.5,'tick');
 for(let k=0;k<3;k++)add(S[8]+.2+k*.35,'pop');
 let t0=S[9]+1.5;for(let k=0;k<3;k++){for(let i=0;i<CMDS[k].length;i++)add(t0+i/30,'key');t0+=CMDS[k].length/30+.35}
 return ev}
