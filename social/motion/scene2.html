<!doctype html><meta charset=utf-8>
<style>
:root{--g:#7fe3a4;--bg:#030504;--p:#09110c;--ln:#1c3a2a;--tx:#eaf5ee;--dim:#7a9886;--warn:#ffd27a;--pk:#ffb7d5;--cy:#8fe8ff}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;background:var(--bg);overflow:hidden;font-family:'Noto Sans','DejaVu Sans',sans-serif;color:var(--tx);position:relative}
.mono{font-family:'JetBrainsMono Nerd Font Mono','DejaVu Sans Mono',monospace}
canvas{position:absolute;left:0;top:0}
#glow{position:absolute;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(127,227,164,.12),rgba(255,183,213,.04) 45%,transparent 68%)}
#scan{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,rgba(127,227,164,.28),transparent)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65))}
#prog{position:absolute;top:104px;left:56px;height:5px;background:linear-gradient(90deg,var(--g),var(--pk));border-radius:3px;width:0}
#progbg{position:absolute;top:104px;left:56px;right:56px;height:5px;background:#10211a;border-radius:3px}
.scene{position:absolute;left:56px;right:56px;top:290px;height:1260px;opacity:0;visibility:hidden}
.win{background:rgba(9,17,12,.92);border:2px solid var(--ln);border-radius:28px;overflow:hidden;box-shadow:0 0 70px rgba(127,227,164,.08)}
.bar{height:62px;display:flex;align-items:center;gap:12px;padding:0 26px;border-bottom:2px solid var(--ln);font-size:24px;color:var(--dim)}
.dt{width:17px;height:17px;border-radius:50%}
.g{color:var(--g)}.dim{color:var(--dim)}.w{color:var(--warn)}.pk{color:var(--pk)}.cy{color:var(--cy)}
.term{padding:28px 32px;font-size:33px;line-height:1.62;white-space:pre}
.chip{border:2px solid var(--ln);background:#0c1812;border-radius:18px;padding:16px 22px;font-size:30px}
.card{background:rgba(9,17,12,.92);border:2px solid var(--ln);border-radius:28px;padding:30px 34px}
.cur{display:inline-block;width:.58em;height:1.05em;background:var(--g);vertical-align:-.15em}
.abs{position:absolute}
.hl{font-size:98px;line-height:1.08;font-weight:800;letter-spacing:-.015em}
.sw{width:92px;height:50px;border-radius:25px;background:#16241c;border:2px solid var(--ln);position:relative;flex:none}
.sw i{position:absolute;top:5px;left:5px;width:36px;height:36px;border-radius:50%;background:#52665a}
</style>

function init(lang,starts,total){LANG=lang;S=starts;TOTAL=total;T=TX[lang];

   <div class=card style="padding:22px 26px"><div class='mono dim' style="font-size:24px">checks</div><div class='mono cy' style="font-size:70px;line-height:1.1" id=ck>0/9</div></div>
  </div></div>
 <div class=win style="margin-top:24px;height:780px"><div class='bar mono'>${dots}&nbsp;beril scan · passive</div><div class='term mono' id=t2 style="font-size:31px;line-height:1.7"></div></div>
</div>

// ---- timing constants shared by seek() and events()
const TY0=.35,TYC=36;           // scene0 command typing
const CMD0='./beril scan --target your-app';
function D(i){return (i<5?S[i+1]:TOTAL+1)-S[i]}
function events(){const ev=[];const add=(t,k,v)=>ev.push([t,k,v||1]);
 // scene0 typing
 for(let i=0;i<CMD0.length;i++)add(S[0]+TY0+i/TYC,'key');
 add(S[0]+.1,'ping');
 for(let k=0;k<3;k++)add(S[0]+1.3+k*.42,'tick');
 for(let i=1;i<6;i++)add(S[i]-.05,'whoosh');
 // scene1
 add(S[1]+.5,'ping');add(S[1]+1.3,'pop');
 const tg=T.tagl;for(let i=0;i<tg.length;i++)add(S[1]+1.9+i/34,'key');
 for(let k=0;k<3;k++)add(S[1]+3.0+k*.3,'pop');
 // scene2 checks
 const d2=D(2),step=Math.max(.5,(d2*.62)/9);for(let k=0;k<9;k++)add(S[2]+.7+k*step+step*.8,'tick');
 add(S[2]+d2*.8,'chime');
 // scene3
 const d3=D(3);add(S[3]+d3*.18,'pop');add(S[3]+d3*.36,'pop');add(S[3]+d3*.55,'pop');add(S[3]+d3*.78,'pop');
 // scene4
 const d4=D(4);for(let k=0;k<5;k++)add(S[4]+.7+k*((d4-2.6)/5)+.3,'switch');
 // scene5
 add(S[5]+.2,'ping');let t0=S[5]+1.6;for(let k=0;k<3;k++){for(let i=0;i<CMDS[k].length;i++)add(t0+i/30,'key');t0+=CMDS[k].length/30+.4}
 add(S[5]+D(5)*.55,'chime');
 return ev}

// ---- background canvas: hex rain + sparkles
const cv=$('cv'),cx=cv.getContext('2d');
const COLS=27;
function bg(t,phase){cx.clearRect(0,0,1080,1920);cx.font="22px 'JetBrainsMono Nerd Font Mono',monospace";
 for(let c=0;c<COLS;c++){const x=c*40+8,sp=60+rnd(c)*120,off=rnd(c+50)*2000;
  for(let r=0;r<22;r++){const y=((t*sp+off-r*30)%2100)-60;const a=(1-r/22)*.12*(.4+.6*rnd(c*9+r));
   if(a<.01)continue;cx.fillStyle=`rgba(127,227,164,${a})`;cx.fillText(GL[Math.floor(rnd(c*13+r+Math.floor(t*3))*GL.length)],x,y)}}
 // sparkles
 for(let i=0;i<14;i++){const x=(rnd(i)*1080+30*Math.sin(t*.6+i))%1080,y=1920-((t*40+rnd(i+30)*1920)%1920);const a=.25+.25*Math.sin(t*2+i);

const SC=['s0','s1','s2','s3','s4','s5'];
function seek(t){
 $('prog').style.width=(968*cl(t/TOTAL))+'px';
 $('scan').style.top=((t*230)%1920)+'px';
 $('glow').style.left=(540-550+280*Math.sin(t*.35))+'px';$('glow').style.top=(860-550+200*Math.cos(t*.28))+'px';
 bg(t);
 const n=6;
 for(let i=0;i<n;i++){const s0=S[i],s1=i<n-1?S[i+1]:TOTAL+1,e=$(SC[i]);
  const a=i==0?1:ez((t-s0)/.4),o=i<n-1?ez((t-(s1-.28))/.28):0,op=t<s0-.01?0:a*(1-o);
  e.style.opacity=op;e.style.transform=`translateY(${(1-a)*60-o*50}px) scale(${1-.03*o})`;e.style.visibility=op<=0?'hidden':'visible';
  if(op>0)scene(i,t-s0,s1-s0);}
}

 if(i==0){

   L.forEach((l,k)=>{const a=u>t1+k*.42;if(a)out+=`<span class=g>0${k+1}</span> <span class=dim>›</span> ${l}  <span class=g>✓</span>\n`})}

  [0,1,2].forEach(k=>{const a=ez((u-3.0-k*.3)/.4);$('ch'+k).style.opacity=a;$('ch'+k).style.transform=`translateY(${(1-a)*24}px)`;
   const a2=ez((u-3.9-k*.3)/.4);$('st'+k).style.opacity=a2;$('st'+k).style.transform=`translateY(${(1-a2)*24}px)`;
   $('sn'+k).textContent=Math.round([65,10,25][k]*ez((u-4-k*.3)/1.1));});
 }
