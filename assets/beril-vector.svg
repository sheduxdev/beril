<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Beril, green eyes and pistachio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110d"/>
      <stop offset="0.55" stop-color="#0a1712"/>
      <stop offset="1" stop-color="#0e1f18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.48" r="0.42">
      <stop offset="0" stop-color="#6fe39a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6fe39a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efd3b0"/>
      <stop offset="1" stop-color="#d8ac83"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17211c"/>
      <stop offset="1" stop-color="#0a100d"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#b9ffcf"/>
      <stop offset="0.35" stop-color="#5fe08b"/>
      <stop offset="0.75" stop-color="#1f9d5c"/>
      <stop offset="1" stop-color="#0c4b2c"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d9a8"/>
      <stop offset="1" stop-color="#b7c977"/>
    </linearGradient>
    <linearGradient id="nut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dbb62"/>
      <stop offset="1" stop-color="#5d7c3a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#glow)"/>
  <g stroke="#5fe08b" stroke-width="1" opacity="0.07">
    <path d="M0 100h1200M0 200h1200M0 300h1200M0 400h1200"/>
    <path d="M100 0v500M200 0v500M300 0v500M400 0v500M500 0v500M600 0v500M700 0v500M800 0v500M900 0v500M1000 0v500M1100 0v500"/>
  </g>
  <rect width="1200" height="500" filter="url(#grain)" opacity="0.7"/>

  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="80" y="220" fill="#effff7" font-size="118" font-weight="700" letter-spacing="10">BERIL</text>
    <text x="86" y="272" fill="#7be5a4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" letter-spacing="4">CYBER INTELLIGENCE</text>
    <text x="86" y="330" fill="#a9c4b6" font-size="19" letter-spacing="1">green eyes. pistachio patience. evidence first.</text>
    <path d="M86 360h210" stroke="#5fe08b" stroke-width="2" opacity="0.7"/>
    <text x="86" y="400" fill="#6b8d7b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">FORUMS / EXPERTS / TOOLS / METHODS</text>
  </g>

  <g transform="translate(900 250)">
