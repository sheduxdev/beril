      <path d="M-30 0 C-14 -8 14 -8 30 0 C14 8 -14 8 -30 0 Z" fill="url(#nut)"/>
      <path d="M-26 0 C-10 -4 10 -4 26 0" fill="none" stroke="#41552c" stroke-width="1.5" opacity="0.7"/>
    </g>
    <g transform="translate(1120 120) rotate(24)">
      <ellipse cx="0" cy="0" rx="24" ry="16" fill="url(#shell)"/>
      <path d="M-24 0 C-11 -6 11 -6 24 0 C11 6 -11 6 -24 0 Z" fill="url(#nut)"/>
    </g>
    <g transform="translate(770 90) rotate(8)">
      <ellipse cx="0" cy="0" rx="18" ry="12" fill="url(#shell)"/>
      <path d="M-18 0 C-8 -5 8 -5 18 0 C8 5 -8 5 -18 0 Z" fill="url(#nut)"/>
    </g>
    <g transform="translate(1080 380) rotate(-32)">
      <ellipse cx="0" cy="0" rx="22" ry="14" fill="url(#shell)"/>
      <path d="M-22 0 C-10 -5 10 -5 22 0 C10 5 -10 5 -22 0 Z" fill="url(#nut)"/>
    </g>
    <g transform="translate(660 330) rotate(12)" opacity="0.8">
