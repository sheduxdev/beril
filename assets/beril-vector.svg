    <path d="M-188 -40 C-206 -176 -132 -258 -18 -262 C110 -266 190 -184 186 -46 C184 34 214 96 196 164 C178 230 118 282 4 284 C-112 286 -176 232 -194 164 C-212 96 -190 40 -188 -40 Z" fill="url(#hair)"/>
    <path d="M-152 106 C-170 196 -128 248 -48 266 L-156 274 C-190 232 -198 160 -172 96 Z" fill="#0b1510"/>
    <path d="M152 106 C170 196 128 248 48 266 L156 274 C190 232 198 160 172 96 Z" fill="#0b1510"/>

    <path d="M-98 236 C-58 286 58 286 98 236 L104 330 C58 356 -58 356 -104 330 Z" fill="url(#skin)"/>
    <ellipse cx="0" cy="18" rx="128" ry="160" fill="url(#skin)"/>

    <path d="M-124 -18 C-118 -112 -62 -152 0 -152 C62 -152 118 -112 124 -18 C92 -84 44 -102 0 -102 C-44 -102 -92 -84 -124 -18 Z" fill="url(#hair)"/>

    <g fill="none" stroke="#4b2f24" stroke-width="4" stroke-linecap="round">
      <path d="M-92 -18 C-72 -38 -40 -38 -20 -18"/>
      <path d="M20 -18 C40 -38 72 -38 92 -18"/>
    </g>

    <g>
      <path d="M-96 28 C-72 6 -36 6 -12 28 C-36 52 -72 52 -96 28 Z" fill="#fbf6ec"/>
      <circle cx="-54" cy="29" r="23" fill="url(#iris)"/>
