      <path d="M-96 28 C-72 52 -36 52 -12 28" fill="none" stroke="#b98668" stroke-width="2" opacity="0.7"/>
    </g>
    <g>
      <path d="M12 28 C36 6 72 6 96 28 C72 52 36 52 12 28 Z" fill="#fbf6ec"/>
      <circle cx="54" cy="29" r="23" fill="url(#iris)"/>
      <circle cx="54" cy="29" r="9" fill="#07110c"/>
      <circle cx="47" cy="21" r="6" fill="#ffffff" opacity="0.9"/>
      <circle cx="62" cy="38" r="3" fill="#d7ffe6" opacity="0.8"/>
      <path d="M12 28 C36 6 72 6 96 28" fill="none" stroke="#1c1512" stroke-width="5" stroke-linecap="round"/>
      <path d="M12 28 C36 52 72 52 96 28" fill="none" stroke="#b98668" stroke-width="2" opacity="0.7"/>
    </g>

    <path d="M-2 44 C-10 80 -14 96 2 104 C10 108 18 106 22 100" fill="none" stroke="#b98668" stroke-width="3" stroke-linecap="round"/>
    <path d="M-34 136 C-16 146 16 146 34 136 C18 158 -18 158 -34 136 Z" fill="#b96b67"/>
    <path d="M-34 136 C-14 142 14 142 34 136" fill="none" stroke="#8d4a49" stroke-width="2"/>

    <g fill="none" stroke="#efe3c8" stroke-width="2" opacity="0.45">
